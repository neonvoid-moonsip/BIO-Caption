<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>♡Bio | Caption♡</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1500&q=80");
background-size:cover;
background-position:center;
}

.container{
width:500px;
background:rgba(255,255,255,0.95);
padding:30px;
border-radius:20px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
margin-bottom:20px;
}

select{
width:100%;
padding:12px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
margin:5px;
font-size:16px;
}

.generate{
background:#4f46e5;
color:white;
}

.copy{
background:#10b981;
color:white;
}

#result{
margin-top:20px;
font-size:20px;
font-weight:bold;
min-height:60px;
}

</style>
</head>

<body>

<div class="container">

<h1>✨♡Bio | Caption♡✨</h1>

<select id="category">
    <option value="sunset">🌅 Sunset</option>
    <option value="soft">🌷 Soft</option>
    <option value="cool">😎 Cool</option>
    <option value="deep">🌙 Deep</option>
</select>

<button class="generate" onclick="generateBio()">
Generate Bio
</button>

<button class="copy" onclick="copyBio()">
Copy
</button>

<div id="result">
Your bio will appear here...
</div>

</div>

<script>

const bios = {

sunset: [
"Chasing sunsets and dreams.",
"Golden hour is my favorite hour.",
"Chasing sunsets, collecting skies.",
"Lost in sunsets, found in the stars.",
"A sky full of dreams.",
"Cloud watcher. Sunset lover.",
"Finding beauty in every sunset.",
"The world feels softer at golden hour.",
"Sunsets, clouds, and everything in between.",
"Dancing with the colors of the sky.",
"Just a soul wandering beneath endless skies.",
"Sunset state of mind.",
"Sky above, peace within.",
"Between clouds and dreams.",
"Everything under the same sky.",
"The sky changes every day, and so do we.",
"Every sunset is proof that endings can be beautiful.",
"Under the same sky, across the whole world."
],

soft: [
"Living one day at a time.",
"In my own little world.",
"Creating my own sunshine.",
"Just vibes.",
"Collecting memories.",
"Stay soft.",
"Growing through what I go through.",
"Making ordinary moments beautiful.",
"A work in progress.",
"Soft heart, strong soul.",
"Forever chasing butterflies.",
"Still growing.",
"All about the little things.",
"Somewhere on Earth.",
"♡"
],

cool: [
"Minding my own business.",
"Too busy living.",
"Not everyone gets me, and that's okay.",
"Main character energy.",
"Quiet but not silent.",
"Doing my thing.",
"Offline most of the time.",
"Keep it simple.",
"Existing gracefully.",
"out of office",
"not available",
"Nothing much."
],

deep: [
"Just a soul full of stories.",
"Somewhere between the clouds and the sea.",
"Written in the stars.",
"Unfinished chapter.",
"Unknown destination.",
"We are all stories in the end.",
"Nothing lasts, but nothing is lost.",
"Becoming who I'm meant to be.",
"Life goes on.",
"Everything happens for a reason.",
"One day at a time.",
"Trust the timing.",
"Keep moving forward.",
"Everything in the world."
]

};

function generateBio(){

let category =
document.getElementById("category").value;

let random =
Math.floor(Math.random() * bios[category].length);

document.getElementById("result").innerText =
bios[category][random];

}

function copyBio(){

let text =
document.getElementById("result").innerText;

navigator.clipboard.writeText(text);

alert("Copied!");

}

</script>

</body>
</html>
